version: "3.9"

services:

  db:
    image: postgres:15
    container_name: postgres_primary
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: efiche
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: redis_cache
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: efiche_api
    restart: always
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/efiche
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"

volumes:
  pgdata: